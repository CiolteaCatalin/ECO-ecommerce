        Firma trebuie sa aiba si modulul de gestiune activ. Fara un drept necesar, fara acces la serie sau la o gestiune ori cu o data in afara limitelor utilizatorului, raspunsul este `403 insufficient_permissions`, iar NIR-ul nu se creeaza; mesajul nu spune care drept lipseste.

        **ID-uri necesare**

        Pentru emiterea NIR-ului se trimit ID-ul furnizorului, ID-ul gestiunii si ID-urile cotelor de TVA. Toate se obtin din API V3:

        | ID | Camp in cerere | Se obtine din |
        |---|---|---|
        | ID-ul furnizorului | `supplierId` | [Listare furnizori](#api-1/tag/furnizori/GET/v3/companies/{cif}/suppliers) |
        | ID-ul gestiunii | `products[].destinationWarehouseId` | [Listare gestiuni](#api-1/tag/gestiuni/GET/v3/companies/{cif}/warehouses) |
        | ID-urile cotelor de TVA | `products[].purchaseVatRateId`, `products[].sellingVatRateId` | [Listare cote TVA](#api-1/tag/cote-tva/GET/v3/companies/{cif}/vat-rates) |

        **Moneda si cursul de schimb**

        - `currency` este moneda documentului furnizorului, de exemplu `EUR`. Daca lipseste, se foloseste `RON`.
        - Campurile care se termina in `InDocumentCurrency` sunt in moneda din `currency`.
        - Campurile care se termina in `InRON` sunt mereu in lei.
        - `exchangeRate` arata cati lei valoreaza 1 unitate din `currency`. Este obligatoriu pentru alte monede decat RON. Pentru RON se omite sau se trimite `1`.

        Exemplu: factura furnizorului este in euro, iar cursul este 5 lei pentru 1 euro.

        | Se trimite | Rezultat |
        |---|---|
        | `currency: "EUR"`, `exchangeRate: 5` | NIR-ul este in euro, la cursul de 5 lei |
        | `purchasePriceWithoutVatInDocumentCurrency: 100` | 100 EUR. Serverul calculeaza `purchasePriceWithoutVatInRON: 500` (100 x 5) |
        | `sellingPriceWithoutVatInRON: 615` | 615 lei. Nu se converteste |

        **Valori calculate**

        Se trimit preturile unitare fara TVA; raspunsul adauga preturile cu TVA, preturile de achizitie in RON si totalurile NIR-ului:

        <table class="sb-op-table sb-op-table--calc">
          <thead>
            <tr>
              <th>Camp din raspuns</th>
              <th>Cum se obtine</th>
              <th>Exemplu (10 buc x 100 EUR, curs 5, TVA 21%)</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>products<span class="sb-brk"></span>[].purchase<span class="sb-brk"></span>Price<span class="sb-brk"></span>Without<span class="sb-brk"></span>Vat<span class="sb-brk"></span>In<span class="sb-brk"></span>RON</code></td>
              <td>pret in <code>currency</code> x <code>exchange<span class="sb-brk"></span>Rate</code></td>
              <td>100 x 5 = <code>500</code></td>
            </tr>
            <tr>
              <td><code>products<span class="sb-brk"></span>[].purchase<span class="sb-brk"></span>Price<span class="sb-brk"></span>With<span class="sb-brk"></span>Vat<span class="sb-brk"></span>In<span class="sb-brk"></span>Document<span class="sb-brk"></span>Currency</code></td>
              <td>pret fara TVA + TVA de achizitie</td>
              <td><code>121</code></td>
            </tr>
            <tr>
              <td><code>products<span class="sb-brk"></span>[].purchase<span class="sb-brk"></span>Price<span class="sb-brk"></span>With<span class="sb-brk"></span>Vat<span class="sb-brk"></span>In<span class="sb-brk"></span>RON</code></td>
              <td>pret cu TVA in RON</td>
              <td><code>605</code></td>
            </tr>
            <tr>
              <td><code>products<span class="sb-brk"></span>[].selling<span class="sb-brk"></span>Price<span class="sb-brk"></span>With<span class="sb-brk"></span>Vat<span class="sb-brk"></span>In<span class="sb-brk"></span>RON</code></td>
              <td>pret de vanzare + TVA de vanzare</td>
              <td>615 -> <code>744<span class="sb-brk"></span>.15</code></td>
            </tr>
            <tr>
              <td><code>total<span class="sb-brk"></span>Without<span class="sb-brk"></span>Vat<span class="sb-brk"></span>Calculated<span class="sb-brk"></span>In<span class="sb-brk"></span>Document<span class="sb-brk"></span>Currency</code></td>
              <td>suma pe produse</td>
              <td>10 x 100 = <code>1000</code></td>
            </tr>
            <tr>
              <td><code>total<span class="sb-brk"></span>Vat<span class="sb-brk"></span>Calculated<span class="sb-brk"></span>In<span class="sb-brk"></span>Document<span class="sb-brk"></span>Currency</code></td>
              <td>TVA pe produse</td>
              <td><code>210</code></td>
            </tr>
            <tr>
              <td><code>total<span class="sb-brk"></span>With<span class="sb-brk"></span>Vat<span class="sb-brk"></span>Calculated<span class="sb-brk"></span>In<span class="sb-brk"></span>Document<span class="sb-brk"></span>Currency</code></td>
              <td>total cu TVA</td>
              <td><code>1210</code></td>
            </tr>
          </tbody>
        </table>

        **Erori la emiterea NIR-ului**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V3.** Pentru cheia API, drepturi, abonament sau formatul corpului JSON, detalii in [Erori API V3](#api-1/description/erori-api-v3). Mai jos sunt doar erorile specifice emiterii NIR-ului.

