                    totalWithoutVatCalculatedInDocumentCurrency: 1000
                    totalWithVatCalculatedInDocumentCurrency: 1210
                    totalVatCalculatedInDocumentCurrency: 210
                    supplier:
                      name: Furnizor Alpha SRL
