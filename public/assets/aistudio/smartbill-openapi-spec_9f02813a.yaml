                status_invalid:
                  summary: status cu valoare necunoscuta
                  value:
                    status: 400
                    type: validation_error
                    instance: /SBORO/api/v3/companies/1234/goods-receipts
                    errors:
                      - code: invalid_field_value
                        message: 'Invalid status. Allowed values: active, draft, annulled'
                        docUrl: https://api.smartbill.ro/#v3-error-validation_error
