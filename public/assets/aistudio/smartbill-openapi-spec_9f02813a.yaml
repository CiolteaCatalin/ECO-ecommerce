                  value:
                    errorText: "Seria facturii trebuie specificata in url in parametrul 'seriesname'!"
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                factura_negasita:
                  summary: Factura nu exista
                  value:
                    errorText: Factura cu seria si numarul fac99999999 nu a fost gasita!
                    message: ''
                    number: ''
                    series: ''
                    url: ''
        '403':
          description: Factura nu e ultima din serie si nu poate fi stearsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
