      description: |
        Emite o Nota de Intrare Receptie (NIR) pe baza documentului primit de la furnizor.

        > ⚠️ **Deocamdata NIR-ul se emite doar ca ciorna.** Se trimite `status: "draft"`; orice alta valoare este respinsa. NIR-ul ramane ciorna, fara numar alocat, pana la finalizarea din SmartBill Cloud. Emiterea directa a unui NIR finalizat va fi adaugata ulterior.

        > ℹ️ **Fiecare NIR emis prin API, inclusiv ciornele, consuma din numarul de documente inclus in abonament.**

        **Drepturi necesare**

        Drepturile utilizatorului caruia ii apartine cheia API se seteaza din meniul [Utilizatori](https://cloud.smartbill.ro/core/utilizatori/) in SmartBill Cloud, pe una din cele doua variante:

