    get:
      tags:
        - NIR-uri (Beta)
      summary: Listare NIR-uri
      operationId: listGoodsReceiptsV3
      security:
        - bearerAuth: []
      description: |
        Returneaza NIR-urile firmei, active, ciorne si anulate. Fiecare element din `items` are aceeasi structura ca raspunsul de la Detalii NIR, inclusiv `acquisition` si `products`.

        Firma trebuie sa aiba modulul de gestiune activ. Utilizatorul cheii API are nevoie, in meniul [Utilizatori](https://cloud.smartbill.ro/core/utilizatori/), de **API / Magazin online**, de **Vizualizare** la Documente → Receptii si de **Vizualizare** la Nomenclatoare → Furnizori.

        **Acces la serii si gestiuni**

        Pe varianta **Detaliat**, lista contine doar NIR-urile din seriile permise (Documente → Receptii → **Acces la seriile**) si din gestiunile permise (**Are acces la gestiune**). Daca o singura pozitie e intr-o gestiune nepermisa, tot NIR-ul lipseste din lista. Pe varianta **Simplu** nu exista restrictii pe serii si gestiuni.

        | Situatie | Rezultat |
        |---|---|
        | NIR dintr-o serie sau gestiune nepermisa | Nu apare in listare; la detalii, `404 document_not_found` |
        | Cursor `after` / `before` catre un NIR inaccesibil | `404 cursor_not_found` |
        | Fara acces la nicio serie NIR sau la nicio gestiune | `200` cu `items: []` |

        O serie sau gestiune noua trebuie adaugata de administrator in drepturile utilizatorului ca NIR-urile ei sa devina vizibile. Un NIR care dispare din lista sau intoarce `404` poate fi doar inaccesibil: drepturile trebuie verificate inainte ca documentul sa fie considerat sters in aplicatia integrata.

        **Filtrare**

        `dateFrom` si `dateTo` filtreaza dupa `issueDate` al NIR-ului, nu dupa data documentului furnizorului, si sunt inclusive. Se poate trimite o singura limita sau ambele; pentru o singura zi se trimite aceeasi data in ambele. Filtrul nu inseamna "modificat dupa": un NIR anulat sau modificat ulterior nu reapare doar pentru ca a fost schimbat.

        `status` accepta litere mari sau mici si ignora spatiile de la capete. Fara el, lista contine toate cele trei stari.

        `supplierName` si `supplierVatCode` se comporta ca filtrele `name` si `vatCode` de la [Listare furnizori](#api-1/tag/furnizori/GET/v3/companies/{cif}/suppliers): `supplierName` potriveste oriunde in nume, fara diferenta intre litere mari si mici; `supplierVatCode` potriveste exact CIF-ul si nu normalizeaza prefixul (`RO33333333` nu e gasit de `?supplierVatCode=33333333`).

        Filtrarea se face pe furnizorul asa cum a fost salvat pe NIR, nu pe datele actuale din nomenclator. Un NIR emis pentru `Best supplier` ramane gasit de `?supplierName=best` si dupa ce furnizorul e redenumit in `Worst supplier`, iar `?supplierName=worst` nu il gaseste.

        Filtrele se combina cu AND. Un filtru trimis gol (`?status=`) e ignorat, deci lista nu se filtreaza.

        **Ordonare**

        Lista e ordonata crescator dupa `id`, nu dupa data sau numarul NIR-ului - inclusiv cand pagina e ceruta cu `before`. Editarea unei ciorne in SmartBill pastreaza acelasi `id`. `limit` numara NIR-uri, nu linii de produse: fiecare NIR vine cu toate pozitiile lui in `products`.

        **Preturi**

        Preturile de vanzare sunt `null` pe gestiunile care nu sunt en detail. `null` trebuie tratat separat de `0`. Pentru reconciliere se folosesc preturile si totalurile returnate: rotunjirile si costurile repartizate pot face ca o recalculare din cantitate, pret si cota TVA sa dea alte valori.
      parameters:
        - $ref: '#/components/parameters/CifPath'
        - name: supplierName
          in: query
          schema:
            type: string
          description: Filtreaza dupa numele furnizorului salvat pe NIR (potrivire partiala, case-insensitive)
        - name: supplierVatCode
          in: query
          schema:
            type: string
          description: Filtreaza dupa CIF-ul furnizorului salvat pe NIR (potrivire exacta, case-insensitive)
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: Data minima a NIR-ului, inclusiv, in format `yyyy-MM-dd`. Nu poate depasi `9999-12-31`.
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: Data maxima a NIR-ului, inclusiv, in format `yyyy-MM-dd`. Nu poate fi inainte de 'dateFrom' si nu poate depasi `9999-12-31`.
        - name: status
          in: query
          schema:
            type: string
          description: Filtreaza dupa stare - `active`, `draft` sau `annulled` (case-insensitive)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Numar maxim de rezultate returnate (intre 1 si 100)
        - name: after
          in: query
          schema:
            type: string
          description: Cursor pentru pagina urmatoare, id-ul NIR-ului dupa care se continua. Nu se foloseste impreuna cu 'before'.
        - name: before
          in: query
          schema:
            type: string
          description: Cursor pentru pagina anterioara, id-ul NIR-ului inainte de care se continua. Nu se foloseste impreuna cu 'after'.
      responses:
        '200':
          description: Lista NIR-uri paginata (paginare cursor)
          content:
            application/json:
              schema:
                type: object
