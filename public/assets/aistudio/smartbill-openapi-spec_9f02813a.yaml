          "deliveryDate": "2026-11-23",
          "paymentDate": "2026-11-23",
          "language": "RO",
          "currency": "RON",
          "precision": 2,
          "useStock": false,
          "useIntraCif": false,
          "usePaymentTax": false,
          "useEstimateDetails": false,
          "delegateName": "Ion Popescu",
          "delegateIdentityCard": "AB 123456",
          "delegateAuto": "B-123-ABC",
          "issuerCnp": "1234567890123",
          "issuerName": "Maria Ionescu",
          "client": {
            "name": "Client SRL",
            "vatCode": "RO22222222",
            "code": "CLI001",
            "regCom": "J40/1234/2020",
            "isTaxPayer": true,
            "address": "Str. Lalelei 1",
            "city": "Sector 1",
            "county": "Bucuresti",
            "country": "Romania",
            "email": "client@example.com",
            "phone": "0722000000",
            "contact": "Andrei Popa",
            "iban": "RO49AAAA1B31007593840000",
            "bank": "BCR",
            "saveToDb": false
          },
          "products": [
            {
              "name": "Servicii consultanta",
              "code": "SRV001",
              "productDescription": "Servicii de consultanta IT",
              "translatedName": "Consulting services",
              "measuringUnitName": "ora",
              "translatedMeasuringUnit": "hour",
              "quantity": 1,
              "price": 100,
              "taxName": "Normala",
              "taxPercentage": 21,
              "isService": true,
              "saveToDb": false
            },
            {
              "name": "Discount valoric",
              "isDiscount": true,
              "numberOfItems": 1,
              "discountType": 1,
