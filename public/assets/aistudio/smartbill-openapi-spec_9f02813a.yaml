  /v3/companies/{cif}/vat-rates:
    get:
      tags:
        - Cote TVA
      summary: Listare cote TVA
      operationId: listVatRatesV3
      security:
        - bearerAuth: []
      description: |
        Returneaza cotele de TVA din nomenclatorul tau SmartBill.

        **Relatia cu V1**

        Este acelasi nomenclator ca [Cote TVA](#api-1/tag/configurari/GET/tax) din V1: `name` si `percentage` au aceleasi valori. Aici primesti in plus `id`, `isReverseCharge` si `reverseChargePercentage`.

        Ce trimiti mai departe depinde de document. Facturile, proformele si incasarile V1 primesc `taxName` si `taxPercentage`. [NIR-urile](#api-1/tag/nir-uri-beta) V3 identifica cota prin `id`. Endpointul acesta acopera ambele cazuri; `/tax` doar pe primul.

        **Id-uri**

        Cotele nu pot fi modificate din SmartBill Cloud, doar create si sterse, deci un `id` pastreaza acelasi `name` si acelasi `percentage` cat timp exista. O schimbare de procent inseamna o cota noua, cu id nou. O cota stearsa dispare imediat din listare, iar `GET .../{id}` intoarce `404 vat_rate_not_found` - trateaza situatia ca normala, nu ca eroare de integrare. Id-urile sunt per firma: un id valid pe o firma intoarce `404` pe alta.

        **Taxare inversa**

        Cotele cu taxare inversa au `isReverseCharge` `true` si `percentage` `0`, iar procentul lor de referinta se afla in `reverseChargePercentage`. Filtrul `percentage` se aplica doar campului `percentage`, deci `?percentage=21` nu returneaza o cota cu taxare inversa al carei `reverseChargePercentage` este `21`. Toate cotele cu taxare inversa apar la `?percentage=0`.

        **Filtrare**

        `name` potriveste oriunde in nume, nu doar la inceput: `?name=norm` gaseste si `Normala`, si `Normala2`. Potrivirea ignora literele mari si spatiile de la capetele valorii trimise. `percentage` potriveste exact valoarea, deci `?percentage=21`, `?percentage=21.0` si `?percentage=21.0000` dau acelasi rezultat, iar `?percentage=2` nu gaseste cota de 21%. Un filtru trimis gol (`?name=` sau `?percentage=`) e ignorat, deci primesti lista nefiltrata. Trimise impreuna, cele doua filtre se aplica simultan.
      parameters:
        - $ref: '#/components/parameters/CifPath'
        - name: name
          in: query
          schema:
            type: string
          description: Filtreaza dupa nume (potrivire partiala, case-insensitive)
        - name: percentage
          in: query
          schema:
            type: number
          description: Filtreaza dupa procent (potrivire exacta pe valoare)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Numar maxim de rezultate returnate (intre 1 si 100)
        - name: after
          in: query
          schema:
            type: string
          description: Cursor pentru pagina urmatoare, id-ul cotei dupa care se continua. Nu se foloseste impreuna cu 'before'.
        - name: before
          in: query
          schema:
            type: string
          description: Cursor pentru pagina anterioara, id-ul cotei inainte de care se continua. Nu se foloseste impreuna cu 'after'.
      responses:
        '200':
          description: Lista cote TVA paginata (paginare cursor)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VatRateV3'
                  pagination:
                    type: object
                    properties:
                      next:
                        type: string
                        nullable: true
                        description: URL-ul complet catre pagina urmatoare, sau null daca nu mai exista pagini
                      previous:
                        type: string
                        nullable: true
                        description: URL-ul complet catre pagina anterioara, sau null daca esti pe prima pagina
              example:
                items:
                  - id: vat_01a0aaabdf4374d9ae834e01ea5c26c6
                    name: Normala
                    percentage: 21.0
                    isReverseCharge: false
                    reverseChargePercentage: 0.0
                  - id: vat_01a0aaabd07d7c4e80fc3575a505d730
                    name: Taxare inversa
                    percentage: 0.0
                    isReverseCharge: true
                    reverseChargePercentage: 21.0
                pagination:
                  next: https://ws.smartbill.ro/SBORO/api/v3/companies/{cif}/vat-rates?limit=2&after=vat_01a0aaabd07d7c4e80fc3575a505d730
                  previous: null
        '400':
          description: Parametri de paginare sau filtrare invalizi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseV3'
              examples:
                limit_in_afara_intervalului:
                  summary: limit in afara intervalului 1-100
                  value:
                    status: 400
                    type: validation_error
                    instance: /SBORO/api/v3/companies/1234/vat-rates
                    errors:
                      - code: invalid_field_value
                        message: The 'limit' field must be between 1 and 100.
                        docUrl: https://api.smartbill.ro/#v3-error-validation_error
                        param: limit
                before_si_after_impreuna:
                  summary: before si after folosite simultan
                  value:
                    status: 400
                    type: validation_error
                    instance: /SBORO/api/v3/companies/1234/vat-rates
                    errors:
                      - code: invalid_field_value
                        message: You can only use 'before' or 'after', not both at the same time.
                        docUrl: https://api.smartbill.ro/#v3-error-validation_error
                        param: before
                cursor_malformat:
                  summary: cursor 'after' cu prefix gresit
                  value:
                    status: 400
                    type: validation_error
                    instance: /SBORO/api/v3/companies/1234/vat-rates
                    errors:
                      - code: invalid_field_value
                        message: The 'after' field must start with 'vat_'.
                        docUrl: https://api.smartbill.ro/#v3-error-validation_error
                        param: after
                percentage_invalid:
                  summary: percentage cu valoare care nu e numar
                  value:
                    status: 400
                    type: validation_error
                    instance: /SBORO/api/v3/companies/1234/vat-rates
                    errors:
                      - code: invalid_field_type
                        message: Invalid value for parameter 'percentage'.
                        docUrl: https://api.smartbill.ro/#v3-error-validation_error
                        param: percentage
        '401':
          $ref: '#/components/responses/UnauthorizedV3'
        '403':
          $ref: '#/components/responses/ForbiddenV3'
        '404':
          description: Cursor de paginare inexistent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseV3'
              example:
                status: 404
                type: invalid_request_error
                instance: /SBORO/api/v3/companies/1234/vat-rates
                errors:
                  - code: cursor_not_found
                    message: The cursor with ID 'vat_01a0aaabdf4374d9ae834e01ea5c26c7' was not found.
                    docUrl: https://api.smartbill.ro/#v3-error-invalid_request_error
        '405':
          $ref: '#/components/responses/MethodNotAllowedV3'
        '406':
          $ref: '#/components/responses/NotAcceptableV3'
