                message: ''
                number: ''
                series: ''
                url: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
  /estimate/v2:
    post:
      tags:
      - Proforme
      summary: Emitere proforma
      operationId: createEstimateV2
      security:
      - basicAuth: []
      description: |
        Emite o proforma noua. Poti emite proforma ca ciorna (draft), pe care o finalizezi ulterior din interfata SmartBill.

        > ℹ️ **Fiecare proforma emisa prin API, inclusiv ciornele, consuma din numarul de documente inclus in abonament.**

        **Ai primit o eroare la emiterea proformei?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `companyVatCode`, drepturi pe firma sau pe serie, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar erorile specifice emiterii de proforma.

