  /payment:
    post:
      tags:
      - Incasari
      summary: Emitere incasare
      operationId: createPayment
      security:
      - basicAuth: []
      description: |
        Emite o incasare. Tipul incasarii (`type`) determina ce campuri sunt necesare si daca se genereaza un document numerotat.

        > ℹ️ **Fiecare incasare emisa prin API consuma din numarul de documente inclus in abonament.**

        `Chitanta` si `Bon` genereaza documente numerotate - chitanta pe seria trimisa in `seriesName`, bonul fiscal pe casa de marcat configurata. Celelalte tipuri (`Card`, `Ordin plata` etc.) emit incasarea fara document separat.

        ## Emiterea unui bon fiscal

        Pentru bon fiscal trimite `type: Bon`. Inainte de primul apel trebuie sa existe o casa de marcat implicita configurata in contul de Cloud, la **Configurari > Case de marcat** - pe ea se emit bonurile. Configurarea se face per utilizator: casa de marcat trebuie configurata pentru utilizatorul cu care te autentifici.

        Exista doua moduri de a tipari bonul, alese prin campul `returnFiscalPrinterText`:

        **1. Tiparire din contul SmartBill** - `returnFiscalPrinterText: false` (implicit)

        Bonul este inserat in SmartBill prin API si se tipareste din contul SmartBill. Campul `message` din raspuns vine gol. Recomandat cand casa de marcat se afla in alta locatie fizica.

        **2. Tiparire directa pe casa de marcat** - `returnFiscalPrinterText: true`

        Raspunsul contine campul `message` cu continutul bonului codificat Base64. Continutul trebuie decodat si scris intr-un fisier cu numele si extensia configurate pentru casa de marcat (implicit `bon.inp`).

        La emiterea unui bon, raspunsul contine `id` (identificatorul unic al bonului, cu care poti prelua ulterior continutul prin `GET /payment/text`), `number` (la emiterea prin API vine `0` - numarul se aloca pe casa de marcat, la tiparire) si, in cazul al doilea, `message`.

        Modalitatea de plata se detaliaza prin campurile `receivedCash`, `receivedCard`, `receivedTicheteMasa` si celelalte campuri `received*`.

        Bonul fiscal se emite doar in lei: `currency` trebuie sa fie `RON` (valoarea implicita).

        Pe liniile de bon, trimite doar `taxPercentage` si **omite `taxName`**. Un cont poate avea mai multe cote cu acelasi procent, iar daca cea trimisa in `taxName` nu e configurata pe casa de marcat, apelul e respins. Fara `taxName`, serverul alege o cota configurata pe casa.

        Casa de marcat implicita este legata de **utilizator**, nu de firma: bonul se emite pe casa de marcat implicita a utilizatorului cu care se face apelul la API, chiar daca alt utilizator al aceleiasi firme are alta casa setata implicit. Cotele de TVA si metodele de plata se configureaza separat pe fiecare casa de marcat, iar un bon care foloseste o cota neconfigurata pe casa respectiva este respins.

        ## Discount pe bon fiscal

        Pe bon se pot acorda discounturi, ca linii separate cu `isDiscount: true`.

        Pentru a evita anumite limitari ale caselor de marcat (sau blocarea acestora), un discount care acopera mai multe produse se imparte in discounturi mai mici, cate unul pentru fiecare produs. Exemplu: pentru un bon cu 3 produse si un discount total aferent lor, discountul se imparte in 3 bucati, astfel incat bonul va avea 6 pozitii.

        Discountul poate fi procentual (`discountPercentage`) sau valoric (`discountValue`).

        La discountul valoric, `discountValue` se trimite negativ si se scade din totalul bonului ca valoare cu TVA. Linia de discount urmeaza aceeasi regula de preturi ca liniile de produs: cu `isTaxIncluded: true` sumele sunt cu TVA inclus, cu `false` sunt fara.

        Vezi exemplul **Bon fiscal cu discount valoric** din lista de exemple a request-ului.

        **Ai primit o eroare la emiterea incasarii?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `companyVatCode`, drepturi pe firma sau pe serie, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar erorile specifice emiterii incasarii.

        <details>
        <summary><strong>Erori la emiterea incasarii</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Datele clientului lipsesc</td>
              <td><code>Datele clientului trebuie specificate. Ele se preiau din factura doar in cazul in care usePaymentDetails = true.</code></td>
              <td>Trimite obiectul `client` (nume + CIF), sau `useInvoiceDetails: true` ca sa preiei clientul din factura.</td>
            </tr>
            <tr>
              <td>Valoarea incasarii lipseste</td>
              <td><code>Valoarea incasarii trebuie specificata.</code></td>
              <td>Trimite `value` cu suma incasata, sau `useInvoiceDetails: true` ca sa o preiei din factura.</td>
            </tr>
            <tr>
              <td>Tipul incasarii lipseste</td>
              <td><code>Tipul incasarii trebuie specificat.</code></td>
              <td>Trimite `type`, de exemplu `Chitanta`, `Card` sau `Ordin plata`.</td>
            </tr>
            <tr>
              <td>CIF client diferit de cel de pe factura (la incasare legata de factura)</td>
              <td><code>Ciful clientului de pe factura fac3802 difera de ciful clientului incasarii!</code></td>
              <td>La incasare legata de factura, clientul trebuie sa aiba acelasi CIF ca cel de pe factura. Foloseste `useInvoiceDetails: true` ca sa eviti nepotrivirea.</td>
            </tr>
            <tr>
              <td>Tip de incasare invalid</td>
              <td><code>Tipul documentului nu a fost gasit pe server!</code></td>
              <td>Foloseste un `type` valid: `Chitanta`, `Bon`, `Card`, `Card online`, `Ordin plata`, `Cec`, `Bilet ordin`, `Mandat postal`, `Extras de cont`, `Ramburs` sau `Alta incasare`. Litera mare nu conteaza (`Cec`, `CEC` si `cec` merg la fel), dar spatiile in plus invalideaza valoarea.</td>
            </tr>
            <tr>
              <td>Seria chitantei nu exista in cont</td>
              <td><code>Seria nu a fost gasita! Folositi o serie creata in contul de cloud.</code></td>
              <td>Trimite in `seriesName` o serie de chitanta creata in contul SmartBill Cloud.</td>
            </tr>
            <tr>
              <td>Factura din <code>invoicesList</code> nu exista</td>
              <td><code>Factura nu a fost gasita!</code></td>
              <td>Verifica `seriesName` si `number` din `invoicesList` - factura trebuie sa existe in cont.</td>
            </tr>
            <tr>
              <td>Factura din <code>invoicesList</code> este anulata</td>
              <td><code>Factura API0059 este anulata, nu o puteti incasa. Restaurati intai factura sau emiteti incasarea independent de factura.</code></td>
              <td>Restaureaza factura cu [PUT /invoice/restore](#tag/facturi/PUT/invoice/restore), sau emite incasarea fara `invoicesList`, trimitand `client` si `value`.</td>
            </tr>
            <tr>
              <td>Factura este deja incasata integral sau stornata</td>
              <td><code>Factura este incasata sau stornata in totalitate.</code></td>
              <td>Verifica intai cu [GET /invoice/paymentstatus](#tag/facturi/GET/invoice/paymentstatus) cat mai e de incasat. O factura cu `unpaidAmount` zero nu mai accepta incasari.</td>
            </tr>
            <tr>
              <td>Bon fiscal pentru o firma neplatitoare de TVA, fara configurarea corespunzatoare a casei de marcat</td>
              <td><code>Configurarea casei de marcat pentru firma neplatitoare de TVA nu a fost facuta.</code></td>
              <td>Verifica in contul SmartBill Cloud, la `Configurari > Case de marcat`, ca modalitatile de incasare au ID-urile salvate pe casa de marcat, ca ID-urile cotelor TVA sunt completate la `Configurari > Cote TVA` si ca te autentifici cu utilizatorul pe care este configurata casa de marcat - configurarea se face per utilizator.</td>
            </tr>
            <tr>
              <td>Nu exista casa de marcat configurata pentru utilizatorul care face apelul</td>
              <td><code>Nu s-a gasit casa de marcat pentru userul x.</code></td>
              <td>Configureaza o casa de marcat in contul SmartBill Cloud, la `Configurari > Case de marcat`, pentru utilizatorul cu care te autentifici.</td>
            </tr>
            <tr>
              <td>Cota de TVA din liniile bonului nu e configurata pe casa de marcat implicita a utilizatorului</td>
              <td><code>Cota TVA Normala (21.00%) nu a fost configurata pentru casa de marcat selectata</code></td>
              <td>Cel mai simplu: omite `taxName` si trimite doar `taxPercentage` - serverul alege atunci o cota configurata pe casa. Altfel, configureaza cota trimisa in `taxName` pe casa de marcat, in contul SmartBill Cloud la `Configurari > Case de marcat`. Cotele se configureaza pe fiecare casa separat, iar casa implicita difera de la un utilizator la altul.</td>
            </tr>
            <tr>
              <td>Bon fiscal emis in alta moneda decat leul</td>
              <td><code>Bonurile fiscale pot fi emise doar in Lei!</code></td>
              <td>Trimite `currency: RON`, sau omite campul - `RON` este valoarea implicita.</td>
            </tr>
            <tr>
              <td>Bon fiscal cu metode de plata care nu sunt configurate pe casa de marcat</td>
              <td><code>Au fost inregistrate urmatoarele plati partiale cu metode de plata neconfigurate pe casa de marcat: Card: 10, Numerar: 5</code></td>
              <td>Verifica configurarile casei de marcat din contul SmartBill Cloud - fiecare metoda folosita in campurile `received*` trebuie sa fie configurata pe casa de marcat.</td>
            </tr>
          </tbody>
        </table>

        </details>

        - --

        ## Tipuri de incasare

        <details>
        <summary><strong>1. Card</strong></summary>

        Emite o incasare cu cardul. Nu necesita serie si nu genereaza document separat.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "issueDate": "2026-11-23",
          "client": {
            "name": "Client SRL",
            "vatCode": "RO22222222",
            "address": "Str. Lalelei 1",
            "city": "Sector 1",
            "county": "Bucuresti",
            "country": "Romania"
          },
          "value": 119,
          "type": "Card"
        }
        ```

        </details>

        <details>
        <summary><strong>2. Chitanta</strong></summary>

        Genereaza un document de chitanta cu numar din seria specificata. Necesita `seriesName` si `isCash: true`.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_CHITANTEI",
          "issueDate": "2026-11-23",
          "client": {
            "name": "Client SRL",
            "vatCode": "RO22222222",
            "address": "Str. Lalelei 1",
            "city": "Sector 1",
            "county": "Bucuresti",
            "country": "Romania"
          },
          "value": 119,
          "text": "Plata factura",
          "type": "Chitanta",
          "isCash": true
        }
        ```

        </details>

        <details>
        <summary><strong>3. Chitanta ciorna (draft)</strong></summary>

        Salveaza chitanta ca ciorna - fara numar atribuit pana la finalizare din interfata SmartBill Cloud. Functioneaza doar pentru tipul `Chitanta`.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_CHITANTEI",
          "issueDate": "2026-11-23",
          "isDraft": true,
          "client": {
            "name": "Client SRL",
            "vatCode": "RO22222222",
            "address": "Str. Lalelei 1",
            "city": "Sector 1",
            "county": "Bucuresti",
            "country": "Romania"
          },
          "value": 119,
          "text": "Plata factura",
          "type": "Chitanta",
          "isCash": true
        }
        ```

        </details>

        <details>
        <summary><strong>4. Bon fiscal</strong></summary>

        Emite un bon pe casa de marcat configurata implicit in contul de Cloud (**Configurari > Case de marcat**). Necesita `type: Bon` si liniile de produse in `products`.

        Campul `returnFiscalPrinterText` alege modul de tiparire:

        - `false` (implicit) - bonul se tipareste din contul SmartBill, iar campul `message` din raspuns vine gol. Recomandat cand casa de marcat se afla in alta locatie fizica.
        - `true` - raspunsul contine `message`, continutul bonului codificat Base64. Trebuie decodat si scris intr-un fisier cu numele si extensia configurate pentru casa de marcat (implicit `bon.inp`).

        Modalitatea de plata se detaliaza prin campurile `received*`. Bonul se emite doar in lei: `currency` trebuie sa fie `RON` (valoarea implicita).

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "issueDate": "2026-11-23",
          "client": {
            "name": "Client SRL",
            "vatCode": "RO22222222",
            "address": "Str. Lalelei 1",
            "city": "Sector 1",
            "county": "Bucuresti",
            "country": "Romania"
          },
          "products": [
            {
              "name": "Produs 1",
              "code": "PRD001",
              "quantity": 1,
              "measuringUnitName": "buc",
              "taxPercentage": 21,
              "price": 10
            }
          ],
          "value": 10,
          "type": "Bon",
          "returnFiscalPrinterText": true,
          "receivedCash": 10
        }
        ```

        Raspunsul contine `id` (folosit ulterior la `GET /payment/text`), `number` si, cand `returnFiscalPrinterText` este `true`, `message`.

        </details>

        <details>
        <summary><strong>5. Ordin de plata</strong></summary>

        Emite o incasare prin ordin de plata. Nu necesita serie si nu genereaza document separat.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "issueDate": "2026-11-23",
          "client": {
            "name": "Client SRL",
            "vatCode": "RO22222222",
            "address": "Str. Lalelei 1",
            "city": "Sector 1",
            "county": "Bucuresti",
            "country": "Romania"
          },
          "value": 119,
          "text": "Plata factura",
          "type": "Ordin plata"
        }
        ```

        </details>

        <details>
        <summary><strong>6. Incasare legata de o factura</strong></summary>

        Asociaza incasarea cu una sau mai multe facturi existente prin `invoicesList`.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "seriesName": "SERIA_CHITANTEI",
          "issueDate": "2026-11-23",
          "client": {
            "name": "Client SRL",
            "vatCode": "RO22222222",
            "address": "Str. Lalelei 1",
            "city": "Sector 1",
            "county": "Bucuresti",
            "country": "Romania"
          },
          "value": 119,
          "type": "Chitanta",
          "isCash": true,
          "invoicesList": [{ "seriesName": "SERIA_FACTURII", "number": "0025" }]
        }
        ```

        </details>

        <details>
        <summary><strong>7. Incasare cu preluare date din factura</strong></summary>

        Cu `useInvoiceDetails: true`, clientul si suma sunt preluate automat din factura - nu mai e nevoie sa le trimiti explicit.

        Doua lucruri de stiut:

        - **`value` nu e ignorat daca il trimiti oricum.** Pe o factura de 111 lei, o incasare cu `value: 50` inregistreaza 50 si lasa 61 de incasat. Asa se face o incasare partiala.
        - **`invoicesList` accepta mai multe facturi.** Un singur apel inregistreaza incasarea pe toate facturile din lista.

        O factura **anulata** nu poate fi incasata: apelul intoarce `400` cu `Factura <serie><numar> este anulata, nu o puteti incasa. Restaurati intai factura sau emiteti incasarea independent de factura.`. O factura deja incasata integral intoarce `400` cu `Factura este incasata sau stornata in totalitate.`.

        ```json
        {
          "companyVatCode": "CIF_FIRMA",
          "issueDate": "2026-11-23",
          "type": "Ordin plata",
          "useInvoiceDetails": true,
          "invoicesList": [{ "seriesName": "SERIA_FACTURII", "number": "0025" }]
        }
        ```

        </details>

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            examples:
              card:
                summary: Incasare cu card
                value:
                  companyVatCode: CIF_FIRMA
                  issueDate: '2026-11-23'
                  client: *client_exemplu
                  value: 119
                  type: Card
              chitanta:
                summary: Incasare cu chitanta
                value:
                  companyVatCode: CIF_FIRMA
                  seriesName: SERIA_CHITANTEI
                  issueDate: '2026-11-23'
                  client: *client_exemplu
                  value: 119
                  text: Plata factura
                  type: Chitanta
                  isCash: true
              chitanta_ciorna:
                summary: Chitanta ciorna (draft)
                description: Salveaza chitanta ca ciorna - fara numar atribuit pana la finalizare. Functioneaza doar pentru tipul Chitanta.
                value:
                  companyVatCode: CIF_FIRMA
                  seriesName: SERIA_CHITANTEI
                  issueDate: '2026-11-23'
                  isDraft: true
                  client: *client_exemplu
                  value: 119
                  text: Plata factura
                  type: Chitanta
                  isCash: true
              bon_fiscal:
                summary: Bon fiscal - tiparire din contul SmartBill
                description: Bonul este inserat in SmartBill si se tipareste din contul SmartBill. Raspunsul nu contine campul message.
                value:
                  companyVatCode: CIF_FIRMA
                  issueDate: '2026-11-23'
                  client: *client_exemplu
                  products:
                  - name: Produs 1
                    code: PRD001
                    quantity: 1
                    measuringUnitName: buc
                    taxPercentage: 21
                    price: 10
                  value: 10
                  type: Bon
                  returnFiscalPrinterText: false
                  receivedCash: 10
              bon_fiscal_casa_de_marcat:
                summary: Bon fiscal - tiparire directa pe casa de marcat
                description: Raspunsul contine campul message cu continutul bonului codificat Base64, de scris in fisierul configurat pentru casa de marcat (implicit bon.inp).
                value:
                  companyVatCode: CIF_FIRMA
                  issueDate: '2026-11-23'
                  client: *client_exemplu
                  products:
                  - name: Produs 1
                    code: PRD001
                    quantity: 1
                    measuringUnitName: buc
                    taxPercentage: 21
                    price: 10
                  value: 10
                  type: Bon
                  returnFiscalPrinterText: true
                  receivedCard: 10
              bon_fiscal_discount:
                summary: Bon fiscal cu discount valoric
                description: Discount valoric pe bon, cu preturi care includ TVA. discountValue se trimite negativ si se scade din total.
                value:
                  companyVatCode: CIF_FIRMA
                  issueDate: '2026-11-23'
                  client: *client_exemplu
                  products:
                  - name: Produs 1
                    code: PRD001
                    quantity: 1
                    measuringUnitName: buc
                    currency: RON
                    isTaxIncluded: true
                    taxPercentage: 21
                    price: 100
                  - name: Discount valoric pe un produs
                    isDiscount: true
                    discountType: 1
                    numberOfItems: 1
                    measuringUnitName: buc
                    currency: RON
                    isTaxIncluded: true
                    taxPercentage: 21
                    discountValue: -10
                  value: 90
                  type: Bon
                  returnFiscalPrinterText: false
                  receivedCash: 90
              ordin_plata:
                summary: 'Incasare fara document: Ordin plata, Card, Card online, CEC, Bilet ordin, Mandat postal, Extras de cont, Ramburs, Alta incasare'
                description: Acelasi payload pentru toate tipurile care nu genereaza document separat. Schimba doar `type`.
                value:
                  companyVatCode: CIF_FIRMA
                  issueDate: '2026-11-23'
                  client: *client_exemplu
                  value: 119
                  text: Plata factura
                  type: Ordin plata
              pe_factura:
                summary: Incasare legata de o factura
                value:
                  companyVatCode: CIF_FIRMA
                  seriesName: SERIA_CHITANTEI
                  issueDate: '2026-11-23'
                  client: *client_exemplu
                  value: 119
                  type: Chitanta
                  isCash: true
                  invoicesList:
                  - seriesName: SERIA_FACTURII
                    number: '0025'
              din_factura:
                summary: Incasare cu preluare date din factura
                description: Preia clientul si suma direct din factura - nu e nevoie sa trimiti client sau value.
                value:
                  companyVatCode: CIF_FIRMA
                  issueDate: '2026-11-23'
                  type: Ordin plata
                  useInvoiceDetails: true
                  invoicesList:
                  - seriesName: SERIA_FACTURII
                    number: '0025'
      responses:
        '200':
          description: |
            Incasare emisa. Campurile din raspuns depind de tipul incasarii: `Chitanta` intoarce `number` si `series`; `Bon` intoarce `id` si `number`, plus `message` cand `returnFiscalPrinterText` este `true`; celelalte tipuri nu genereaza document separat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                fara_document:
                  summary: Card / Ordin plata - fara document numerotat
                  value:
                    errorText: ''
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                chitanta:
                  summary: Chitanta - document numerotat creat
                  value:
                    errorText: ''
                    message: ''
                    number: '0003'
                    series: CH
                    url: ''
                bon_fiscal:
                  summary: Bon fiscal - tiparire din contul SmartBill
                  description: Campul message lipseste, pentru ca returnFiscalPrinterText a fost false.
                  value:
                    errorText: ''
                    id: '12345'
                    number: '12'
                bon_fiscal_casa_de_marcat:
                  summary: Bon fiscal - tiparire directa pe casa de marcat
                  description: Campul message contine continutul bonului codificat Base64, de decodat si scris in fisierul configurat pentru casa de marcat.
                  value:
                    errorText: ''
                    id: '12345'
                    message: 
                    number: '12'
        '400':
          description: Campuri obligatorii lipsa (client, valoare, tip incasare) sau configurare lipsa a casei de marcat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                client_lipsa:
                  summary: Date client lipsa
                  value:
                    errorText: Datele clientului trebuie specificate. Ele se preiau din factura doar in cazul in care usePaymentDetails = true.
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                valoare_lipsa:
                  summary: Valoarea incasarii lipsa
                  value:
                    errorText: Valoarea incasarii trebuie specificata.
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                tip_lipsa:
                  summary: Tipul incasarii lipsa
                  value:
                    errorText: Tipul incasarii trebuie specificat.
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                cif_client_diferit:
                  summary: CIF client difera de cel de pe factura (la incasare legata de factura)
                  value:
                    errorText: Ciful clientului de pe factura fac3802 difera de ciful clientului incasarii!
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                casa_marcat_neconfigurata:
                  summary: Casa de marcat neconfigurata pentru firma neplatitoare de TVA (la bon fiscal)
                  description: "Apare la `type: Bon` cand firma nu este platitoare de TVA si casa de marcat nu are configurarea corespunzatoare in contul SmartBill Cloud."
                  value:
                    errorText: Configurarea casei de marcat pentru firma neplatitoare de TVA nu a fost facuta.
                    message: ''
                    number: '169'
                    url: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /tax:
    get:
      tags:
      - Configurari
      summary: Cote TVA
      operationId: getTaxAndSeries
      security:
      - basicAuth: []
      description: |
        Returneaza cotele de TVA configurate in contul SmartBill. Foloseste `name`-ul unei cote in campul `taxName` la emiterea facturilor, proformelor si incasarilor.

        `/tax` nu returneaza id-uri de cota, iar [NIR-urile](#api-1/tag/nir-uri-beta) V3 identifica cota prin `id`. Daca integrarea ta acopera si NIR-uri, citeste cotele din [Cote TVA](#api-1/tag/cote-tva): acolo primesti si `name`, si `percentage`, deci acopera si emiterea V1 - nu ai nevoie de ambele endpointuri. `/tax` ramane util cand integrarea ta foloseste doar V1 si nu vrei sa adaugi autentificarea Bearer ceruta de V3.

        Endpointul nu are erori proprii: singurele erori posibile sunt cele comune tuturor endpoint-urilor V1 - email/token, `cif`, drepturi pe firma. Vezi [Erori API V1](#api-1/description/erori-api-v1).
      parameters:
      - name: cif
        in: query
        required: true
        description: CIF-ul firmei tale
        schema:
          type: string
        example: CIF_FIRMA
      responses:
        '200':
          description: Cotele de TVA configurate in cont
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorText:
                    type: string
                  taxes:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        percentage:
                          type: number
              example:
                errorText: ''
                message: ''
                number: ''
                series: ''
                url: ''
                taxes:
                - name: Normala
                  percentage: 21
                - name: Redusa
                  percentage: 11
                - name: Taxare inversa
                  percentage: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
  /series:
    get:
      tags:
      - Configurari
      summary: Serii de documente
      operationId: getSeries
      security:
      - basicAuth: []
      description: |
        Returneaza informatii despre seriile de documente configurate in SmartBill.

        **Tipuri de serii:**
        - `f` - serii de facturi
        - `p` - serii de proforme
        - `c` - serii de chitante

        Daca nu specifici `type`, sunt returnate toate seriile.

        **Ai primit o eroare?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `cif`, drepturi pe firma, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar eroarea specifica.

        <details>
        <summary><strong>Erori la listarea seriilor</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>type</code> invalid</td>
              <td><code>Tipul documentului nu poate fi x! Parametrul type poate lua valorile: 'f' pentru factura, 'p' pentru proforma si 'c' pentru chitanta.</code></td>
              <td>Foloseste `type` doar cu `f` (factura), `p` (proforma) sau `c` (chitanta), sau omite-l ca sa primesti toate seriile.</td>
            </tr>
          </tbody>
        </table>

        </details>
      parameters:
      - name: cif
        in: query
        required: true
        description: CIF-ul firmei tale
        schema:
          type: string
        example: CIF_FIRMA
      - name: type
        in: query
        required: false
        description: Filtreaza dupa tipul seriei (f=factura, p=proforma, c=chitanta). Fara type, intoarce toate seriile.
        schema:
          type: string
          enum:
          - f
          - p
          - c
        example: f
      responses:
        '200':
          description: Lista seriilor configurate (fiecare cu `nextNumber` - urmatorul numar disponibil)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesResponse'
              examples:
                all_series:
                  summary: Toate seriile (fara type)
                  value:
                    errorText: ''
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                    list:
                    - name: fac
                      nextNumber: 3821
                      type: f
                    - name: pro
                      nextNumber: 227
                      type: p
                    - name: CH
                      nextNumber: 7
                      type: c
                invoice_series:
                  summary: Doar serii de factura (type=f)
                  value:
                    errorText: ''
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                    list:
                    - name: fac
                      nextNumber: 3821
                      type: f
        '400':
          description: Tip de serie invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorText: "Tipul documentului nu poate fi x! Parametrul type poate lua valorile: 'f' pentru factura, 'p' pentru proforma si 'c' pentru chitanta."
                message: ''
                number: ''
                series: ''
                url: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
  /stocks:
    get:
      tags:
      - Stocuri
      summary: Listare stocuri
      operationId: getStocks
      security:
      - basicAuth: []
      description: |
        Returneaza informatii despre stocurile produselor din gestiuni.

        **Flexibilitate in interogare:**
        - **Fara filtre**: toate produsele din toate gestiunile
        - **Doar gestiune** (`warehouseName`): toate produsele din acea gestiune
        - **Doar produs** (`productName`/`productCode`): stocul acelui produs in toate gestiunile
        - **Ambele**: stocul unui produs anume intr-o gestiune anume

        **Structura raspunsului:**
        Returneaza informatii despre gestiune si detalii de produs:
        - numele si tipul gestiunii (en gros/en detail)
        - numele, codul, unitatea de masura si cantitatea in stoc a produsului

        **Ai primit o eroare la interogarea stocului?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `cif`, drepturi pe firma, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar erorile specifice.

        <details>
        <summary><strong>Erori la interogarea stocului</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>date</code> lipseste</td>
              <td><code>Data la care vreti sa aflati valoarea stocului trebuie specificata!</code></td>
              <td>Trimite `date` in format `yyyy-MM-dd`. Este parametru obligatoriu.</td>
            </tr>
            <tr>
              <td><code>date</code> in format gresit</td>
              <td><code>Data trebuie sa fie de forma yyyy-MM-dd.</code></td>
              <td>Foloseste formatul `yyyy-MM-dd`, de exemplu `2026-11-23`.</td>
            </tr>
            <tr>
              <td>Gestiune inexistenta</td>
              <td><code>Gestiunea DepozitInexistent nu a fost gasita pe server.</code></td>
              <td>Verifica `warehouseName` - e case-sensitive si trebuie sa existe in cont.</td>
            </tr>
          </tbody>
        </table>

        </details>
      parameters:
      - name: cif
        in: query
        required: true
        description: CIF-ul firmei tale
        schema:
          type: string
        example: CIF_FIRMA
      - name: date
        in: query
        required: true
        description: Data la care vrei stocul (format yyyy-MM-dd)
        schema:
          type: string
          format: date
        example: '2026-11-23'
      - name: warehouseName
        in: query
        required: false
        description: Filtreaza dupa numele gestiunii (atentie - case-sensitive)
        schema:
          type: string
        example: Depozit
      - name: productName
        in: query
        required: false
        description: Filtreaza dupa numele produsului
        schema:
          type: string
        example: Mere Golden
      - name: productCode
        in: query
        required: false
        description: Filtreaza dupa codul produsului (SKU)
        schema:
          type: string
        example: PRD004
      responses:
        '200':
          description: |
            Stocul pe gestiuni. Fiecare intrare are `warehouse` (nume + tip) si lista de `products` (`productName`, `productCode`, `measuringUnit`, `quantity`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResponse'
              examples:
                cu_stoc:
                  summary: Produse in gestiune
                  value:
                    errorText: ''
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                    list:
                    - warehouse:
                        warehouseName: Depozit
                        warehouseType: en gros
                      products:
                      - productName: Mere Golden
                        productCode: PRD004
                        measuringUnit: buc
                        quantity: 8
                fara_stoc:
                  summary: Nu exista stoc pentru filtrele date
                  value:
                    errorText: ''
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                    list: []
        '400':
          description: Data lipsa/invalida sau gestiune inexistenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                data_lipsa:
                  summary: Parametrul date lipsa
                  value:
                    errorText: Data la care vreti sa aflati valoarea stocului trebuie specificata!
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                data_format_gresit:
                  summary: Format data invalid
                  value:
                    errorText: Data trebuie sa fie de forma yyyy-MM-dd.
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                gestiune_negasita:
                  summary: Gestiunea nu exista (atentie - case-sensitive)
                  value:
                    errorText: Gestiunea DepozitInexistent nu a fost gasita pe server.
                    message: ''
                    number: ''
                    series: ''
                    url: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
  /document/send:
    post:
      tags:
      - Email
      summary: Trimitere Document prin Email
      operationId: sendDocumentEmail
      security:
      - basicAuth: []
      description: |
        Trimite o factura sau o proforma catre client, pe email, ca atasament.

        **Cerinte**: trebuie sa ai configurat serverul de email in [SmartBill Cloud > Configurare > Email](https://cloud.smartbill.ro/core/configurare_mailuri/).

        **Variabile pentru textul emailului:**
        Parametrul `bodyText` accepta urmatorii marcatori:
        - `#tip document#` - tipul documentului (factura/proforma)
        - `#serie numar document#` - seria si numarul
        - `#link document#` - link catre document
        - `#data emiterii#` - data emiterii
        - `#data scadentei#` - data scadentei
        - `#total document#` - suma totala, cu moneda
        - `#mentiune#` - mentiunile documentului
        - `#nume client#` - numele clientului
        - `#persoana contact#` - persoana de contact

        **Nota**: atat `subject`, cat si `bodyText` trebuie codificate Base64.

        ## Ce e obligatoriu si ce are fallback

        Obligatorii sunt doar `companyVatCode`, `seriesName`, `number` si `type`. Restul au fallback:

        - `to` omis sau gol - emailul se trimite la adresa clientului de pe document;
        - `subject` sau `bodyText` omise - se foloseste sablonul configurat in contul SmartBill.

        Valoarea din `type` nu e sensibila la litere mari: `factura`, `Factura` si `FACTURA` sunt acceptate la fel. `type` selecteaza si tipul de document cautat - o proforma trimisa cu `type: factura` intoarce `Documentul nu a fost gasit`.

        ## Forma raspunsului

        Endpointul nu raspunde ca restul V1. Raspunsul are un obiect `status`, cu `code` si `message`:

        ```json
        { "status": { "code": 0, "message": "Documentul a fost trimis cu succes." } }
        ```

        `code` este `0` la succes si `1` la eroare. Nu exista camp `errorText` - un client care verifica doar `errorText` nu vede niciodata eroarea. Excepția: erorile de autentificare si de acces la firma vin in forma clasica V1, cu `errorText`, si cu status HTTP `401`.

        **Ai primit o eroare la trimiterea emailului?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `companyVatCode`, drepturi pe firma, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar erorile specifice acestui endpoint. Toate vin cu `status.code: 1`.

        <details>
        <summary><strong>Erori la trimiterea emailului</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Valoare neacceptata in <code>type</code></td>
              <td><code>Valoarea campului 'type' nu este suportata (invoice). Valorile acceptate sunt: factura, proforma.</code></td>
              <td>Trimite `factura` sau `proforma`. Variantele englezesti `invoice` si `estimate` nu sunt acceptate. Litera mare nu conteaza.</td>
            </tr>
            <tr>
              <td><code>type</code> lipsa sau gol</td>
              <td><code>type  trebuie specificat. Valorile acceptate sunt: factura, proforma.</code></td>
              <td>`type` e obligatoriu, spre deosebire de `to`, `subject` si `bodyText`.</td>
            </tr>
            <tr>
              <td>Documentul nu exista, sau <code>type</code> nu corespunde tipului lui</td>
              <td><code>Documentul nu a fost gasit</code></td>
              <td>Verifica `seriesName` si `number`. Apare si cand documentul exista, dar e trimis cu tipul greșit - o proforma cu `type: factura`, de exemplu.</td>
            </tr>
            <tr>
              <td><code>seriesName</code> gol</td>
              <td><code>Seria nu a fost gasita! Folositi o serie creata in contul de cloud.</code></td>
              <td>Trimite o serie existenta in contul SmartBill Cloud.</td>
            </tr>
            <tr>
              <td><code>number</code> gol</td>
              <td><code>Numarul documentului  trebuie specificat</code></td>
              <td>Trimite numarul documentului, ca text.</td>
            </tr>
            <tr>
              <td><code>subject</code> nu e codificat Base64</td>
              <td><code>Subiectul emailului trebuie sa fie codat folosind Base64.</code></td>
              <td>Codifica subiectul in Base64 inainte de trimitere.</td>
            </tr>
            <tr>
              <td><code>bodyText</code> nu e codificat Base64</td>
              <td><code>Continutul emailului trebuie sa fie codat folosind Base64.</code></td>
              <td>Codifica si corpul emailului in Base64.</td>
            </tr>
            <tr>
              <td>Adresa de email invalida, in <code>to</code>, <code>cc</code> sau <code>bcc</code></td>
              <td><code>Invalid Addresses</code>, <code>Missing domain</code>, <code>Missing local name</code>, <code>Domain contains illegal character</code></td>
              <td>Mesajul depinde de felul in care e ruptă adresa. La mai multi destinatari, una singura invalida respinge tot apelul.</td>
            </tr>
            <tr>
              <td>Serverul de email nu e configurat in cont</td>
              <td><code>Server-ul de email nu a fost configurat.</code></td>
              <td>Configureaza serverul de email in [SmartBill Cloud > Configurare > Email](https://cloud.smartbill.ro/core/configurare_mailuri/).</td>
            </tr>
          </tbody>
        </table>

        </details>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailRequest'
            examples:
              invoice:
                summary: Trimitere factura
                value:
                  companyVatCode: CIF_FIRMA
                  seriesName: SERIA_FACTURII
                  number: '0025'
                  type: factura
                  to: client@example.com
                  cc: ''
                  bcc: ''
                  subject: RmFjdHVyYSBGQUMgMDAyNQ==
                  bodyText: QnVuYSB6aXVhLCBBdGFzYXQgdmEgdHJhbnNtaXRlbSBmYWN0dXJhLg==
              proforma:
                summary: Trimitere proforma
                value:
                  companyVatCode: CIF_FIRMA
                  seriesName: SERIA_PROFORMEI
                  number: '0001'
                  type: proforma
                  to: client@example.com
                  subject: UHJvZm9ybWEgUFJPIDAwMDE=
                  bodyText: QnVuYSB6aXVhLCBBdGFzYXQgdmEgdHJhbnNtaXRlbSBwcm9mb3JtYS4=
      responses:
        '200':
          description: Email trimis cu succes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSendResponse'
              example:
                status:
                  code: 0
                  message: Documentul a fost trimis cu succes.
        '400':
          description: Document negasit, parametru invalid sau server de email neconfigurat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSendResponse'
              examples:
                tip_nesuportat:
                  summary: Valoare neacceptata in `type`
                  value:
                    status:
                      code: 1
                      message: 'Valoarea campului ''type'' nu este suportata (invoice). Valorile acceptate sunt: factura, proforma.'
                tip_lipsa:
                  summary: '`type` lipsa sau gol'
                  value:
                    status:
                      code: 1
                      message: 'type  trebuie specificat. Valorile acceptate sunt: factura, proforma.'
                document_negasit:
                  summary: Documentul nu exista in cont
                  value:
                    status:
                      code: 1
                      message: Documentul nu a fost gasit
                serie_lipsa:
                  summary: '`seriesName` gol'
                  value:
                    status:
                      code: 1
                      message: Seria nu a fost gasita! Folositi o serie creata in contul de cloud.
                numar_lipsa:
                  summary: '`number` gol'
                  value:
                    status:
                      code: 1
                      message: Numarul documentului  trebuie specificat
                subiect_necodificat:
                  summary: '`subject` nu e codificat Base64'
                  value:
                    status:
                      code: 1
                      message: Subiectul emailului trebuie sa fie codat folosind Base64.
                corp_necodificat:
                  summary: '`bodyText` nu e codificat Base64'
                  value:
                    status:
                      code: 1
                      message: Continutul emailului trebuie sa fie codat folosind Base64.
                adresa_invalida:
                  summary: Adresa de email invalida
                  value:
                    status:
                      code: 1
                      message: Invalid Addresses
                server_email_neconfigurat:
                  summary: Serverul de email nu e configurat in cont
                  value:
                    status:
                      code: 1
                      message: Server-ul de email nu a fost configurat.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /payment/text:
    get:
      tags:
      - Incasari
      summary: Preluare date bon fiscal
      operationId: getPaymentText
      security:
      - basicAuth: []
      description: |
        Preia continutul unui bon fiscal, codificat Base64, pentru trimitere la imprimanta fiscala.

        Endpoint specific bonurilor fiscale. Parametrul `id` este ID-ul intern al bonului fiscal, returnat la crearea acestuia. Incasarile obisnuite (`Chitanta`, `Card`, `Ordin plata`) nu intorc un astfel de `id`.

        Continutul depinde de casa de marcat setata ca implicita pentru utilizatorul care face apelul - nu de casa pe care s-a emis bonul. Consecinte:

        - acelasi `id` intoarce alt continut daca intre apeluri s-a schimbat casa implicita;
        - doi utilizatori cu case implicite diferite primesc formate diferite pentru acelasi bon;
        - daca pe casa implicita nu e configurata cota de TVA din liniile bonului, apelul intoarce `400`, desi bonul a fost emis cu succes.

        **Ai primit o eroare la preluarea datelor bonului fiscal?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `cif`, drepturi pe firma sau pe serie, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar erorile specifice acestui endpoint.

        <details>
        <summary><strong>Erori la preluarea datelor bonului fiscal</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>id</code> invalid sau inexistent</td>
              <td><code>500</code> cu raspuns HTML</td>
              <td>Verifica faptul ca `id` provine din raspunsul de creare a unui bon fiscal.</td>
            </tr>
            <tr>
              <td>Cota de TVA din liniile bonului nu e configurata pe casa de marcat implicita din momentul apelului</td>
              <td><code>Cota TVA Normala2 (21.00%) nu a fost configurata pentru casa de marcat selectata</code></td>
              <td>Bonul e valid - doar generarea textului pentru casa curenta eșueaza. Configureaza cota pe casa de marcat implicita a utilizatorului care apeleaza, la `Configurari > Case de marcat`.</td>
            </tr>
          </tbody>
        </table>

        </details>
      parameters:
      - name: cif
        in: query
        required: true
        schema:
          type: string
        example: CIF_FIRMA
      - name: id
        in: query
        required: true
        description: ID-ul bonului fiscal (returnat la crearea acestuia)
        schema:
          type: integer
        example: 1384
      responses:
        '200':
          description: Continutul bonului fiscal, in `message`, codificat Base64
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorText:
                    type: string
                  message:
                    type: string
                    description: Continutul bonului fiscal codificat Base64
              example:
                errorText: ''
                message: Qm9uIGZpc2NhbCBjb250ZW50Li4u
        '500':
          description: |
            `id` invalid sau inexistent. Verifica faptul ca `id`-ul provine de la crearea unui bon fiscal.
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /payment/chitanta:
    delete:
      tags:
      - Incasari
      summary: Stergere chitanta
      operationId: deleteReceipt
      security:
      - basicAuth: []
      description: |
        Sterge o chitanta. Poate fi stearsa doar ultima chitanta din serie. Parametrii se trimit in URL (query string).

        Pentru incasari care nu sunt chitante (`Card`, `Ordin plata` etc.), foloseste [Stergere incasare](#tag/incasari/DELETE/payment/v2).

        **Ai primit o eroare la stergere?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `cif`, drepturi pe firma sau pe serie, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar erorile specifice stergerii chitantei.

        <details>
        <summary><strong>Erori la stergerea chitantei</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Chitanta nu e ultima din serie</td>
              <td><code>Nu poti sterge documentul cu seria si numarul CH 0003, deoarece nu este ultimul din serie!</code></td>
              <td>Doar ultima chitanta din serie poate fi stearsa.</td>
            </tr>
            <tr>
              <td><code>number</code> lipseste din URL</td>
              <td><code>Numarul chitantei trebuie specificat in url in parametrul 'number'!</code></td>
              <td>Adauga `number` in query string cu numarul chitantei de sters.</td>
            </tr>
            <tr>
              <td><code>seriesname</code> lipseste din URL</td>
              <td><code>Seria chitantei trebuie specificata in url in parametrul 'seriesname'!</code></td>
              <td>Adauga `seriesname` in query string cu seria chitantei.</td>
            </tr>
            <tr>
              <td>Chitanta nu exista</td>
              <td><code>Chitanta nu a fost gasita.</code></td>
              <td>Verifica `seriesname` si `number`.</td>
            </tr>
          </tbody>
        </table>

        </details>
      parameters:
      - name: cif
        in: query
        required: true
        schema:
          type: string
        example: CIF_FIRMA
      - name: seriesname
        in: query
        required: true
        description: Seria chitantei
        schema:
          type: string
        example: CHT
      - name: number
        in: query
        required: true
        description: Numarul chitantei
        schema:
          type: string
        example: 0009
      responses:
        '200':
          description: Chitanta stearsa cu succes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                errorText: ''
                message: Chitanta cu seria si numarul CH0006 a fost stearsa cu succes.
                number: ''
                series: ''
                url: ''
        '400':
          description: Parametru lipsa in URL sau document negasit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                numar_lipsa:
                  summary: Parametrul number lipsa
                  value:
                    errorText: "Numarul chitantei trebuie specificat in url in parametrul 'number'!"
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                serie_lipsa:
                  summary: Parametrul seriesname lipsa
                  value:
                    errorText: "Seria chitantei trebuie specificata in url in parametrul 'seriesname'!"
                    message: ''
                    number: ''
                    series: ''
                    url: ''
                chitanta_negasita:
                  summary: Chitanta nu exista
                  value:
                    errorText: Chitanta nu a fost gasita.
                    message: ''
                    number: ''
                    series: ''
                    url: ''
        '403':
          description: Chitanta nu e ultima din serie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorText: Nu poti sterge documentul cu seria si numarul CH 0003, deoarece nu este ultimul din serie!
                message: ''
                number: ''
                series: ''
                url: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
  /payment/v2:
    delete:
      tags:
      - Incasari
      summary: Stergere incasare
      operationId: deletePaymentV2
      security:
      - basicAuth: []
      description: |
        Sterge o incasare care nu este chitanta (`Card`, `CEC`, `Bilet ordin`, `Ordin plata`, `Mandat postal`, `Alta incasare`). Parametrii se trimit in URL (query string).

        Chitantele si bonurile fiscale nu se sterg de aici. Pentru chitante foloseste [Stergere chitanta](#tag/incasari/DELETE/payment/chitanta).

        Incasarea se identifica in doua moduri (pe langa `cif` si `paymentType`, mereu obligatorii):

        1. **Dupa factura**: `invoiceSeries` + `invoiceNumber`.
        2. **Dupa detaliile incasarii**: `paymentDate` + `paymentValue` + `clientName` + `clientCif`. Toate patru sunt necesare - cu unul singur dintre `clientName` si `clientCif` incasarea nu e gasita.

        Aici `paymentType` este **sensibil la litere mari**, spre deosebire de emiterea incasarii: pentru cec valoarea acceptata la stergere este `CEC`, nu `Cec`.

        `clientCif` trebuie sa fie exact valoarea stocata pe incasare. Daca clientul e platitor de TVA, CIF-ul e stocat cu prefixul `RO`, deci `RO22222222`, nu `22222222`.

        La succes raspunsul este `200` cu `errorText` gol.

        **Ai primit o eroare la stergere?**

        **Erorile de autentificare si autorizare sunt comune tuturor endpoint-urilor V1.** Pentru email/token, `cif`, drepturi pe firma sau pe serie, vezi [Erori API V1](#api-1/description/erori-api-v1). Mai jos gasesti doar erorile specifice stergerii incasarii.

        <details>
        <summary><strong>Erori la stergerea incasarii</strong></summary>

        <table>
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Nicio incasare nu corespunde datelor trimise</td>
              <td><code>Nu au fost gasite incasari conform datelor specificate.</code></td>
              <td>Verifica datele de identificare (factura sau data+valoare+client). Trebuie sa corespunda exact unei incasari existente.</td>
            </tr>
            <tr>
              <td><code>paymentType</code> este Chitanta (tip nepermis aici)</td>
              <td><code>Tipul incasarii (paymentType) poate fi 'Card', 'CEC', 'Bilet ordin', 'Ordin plata', 'Mandat postal', 'Alta incasare'.</code></td>
              <td>Chitantele se sterg prin [Stergere Chitanta](#tag/incasari/DELETE/payment/chitanta), nu prin acest endpoint.</td>
            </tr>
          </tbody>
        </table>

        </details>
      parameters:
      - name: cif
        in: query
        required: true
        schema:
          type: string
        example: CIF_FIRMA
      - name: paymentType
        in: query
        required: true
        description: 'Tipul incasarii de sters. Nu poate fi `Chitanta` sau `Bon fiscal`. Trebuie sa fie tipul incasarii existente pe factura: cu alt tip apelul intoarce `Nu au fost gasite incasari conform datelor specificate.`'
        schema:
          type: string
          enum:
          - Card
          - Card online
          - CEC
          - Bilet ordin
          - Ordin plata
          - Mandat postal
          - Extras de cont
          - Ramburs
          - Alta incasare
        example: Ordin plata
      - name: invoiceSeries
        in: query
        required: false
        description: Seria facturii, pentru stergere dupa factura
        schema:
          type: string
      - name: invoiceNumber
        in: query
        required: false
        description: Numarul facturii, pentru stergere dupa factura
        schema:
          type: string
      - name: paymentDate
        in: query
        required: false
        description: Data incasarii, pentru stergere dupa detaliile incasarii
        schema:
          type: string
          format: date
      - name: paymentValue
        in: query
        required: false
        description: Valoarea incasarii, pentru stergere dupa detaliile incasarii
        schema:
          type: number
      - name: clientName
        in: query
        required: false
        description: Numele clientului, pentru stergere dupa detaliile incasarii
        schema:
          type: string
      - name: clientCif
        in: query
        required: false
        description: CIF-ul clientului, pentru stergere dupa detaliile incasarii
        schema:
          type: string
      responses:
        '200':
          description: Incasare stearsa cu succes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
