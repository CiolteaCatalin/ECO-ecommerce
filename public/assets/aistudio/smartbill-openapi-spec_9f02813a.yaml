        ## Tipuri de emitere

        <details>
        <summary><strong>1. Emitere NIR pe gestiune global-valorica</strong></summary>

        NIR pe o gestiune global-valorica, care apare cu `type: "en detail"` in [Listare gestiuni](#api-1/tag/gestiuni/GET/v3/companies/{cif}/warehouses). Pe acest tip de gestiune `sellingPriceWithoutVatInRON` este obligatoriu si trebuie sa fie cel putin pretul de achizitie convertit in RON. Raspunsul calculeaza si pretul de vanzare cu TVA.

        ```json
        {
          "status": "draft",
          "seriesName": "NIR",
          "issueDate": "2026-11-23",
          "currency": "RON",
          "supplierId": "sup_019f0000000070008000000000000001",
          "acquisition": {
            "type": "Invoice",
            "number": "FURN1024",
            "issueDate": "2026-11-23",
            "dueDate": "2026-12-23",
            "totalWithVatInDocumentCurrency": 1210,
            "totalVatInDocumentCurrency": 210
          },
          "products": [
            {
              "name": "Produs exemplu",
              "code": "PROD-001",
              "measuringUnitName": "buc",
              "documentQuantity": 10,
              "receivedQuantity": 10,
              "purchasePriceWithoutVatInDocumentCurrency": 100,
              "sellingPriceWithoutVatInRON": 150,
              "isService": false,
              "destinationWarehouseId": "ware_019f0000000070008000000000000002",
              "purchaseVatRateId": "vat_019f0000000070008000000000000003",
              "sellingVatRateId": "vat_019f0000000070008000000000000003"
            }
          ]
        }
        ```

        </details>

        <details>
        <summary><strong>2. Emitere NIR pe gestiune cantitativ-valorica</strong></summary>

        Aceeasi factura, pe o gestiune cantitativ-valorica, care apare cu `type: "en gros"` in [Listare gestiuni](#api-1/tag/gestiuni/GET/v3/companies/{cif}/warehouses). Pretul de vanzare nu se trimite: pe acest tip de gestiune nu se foloseste, iar in raspuns ambele preturi de vanzare sunt `null`. `sellingVatRateId` ramane obligatoriu daca firma este platitoare de TVA.

        ```json
        {
          "status": "draft",
          "seriesName": "NIR",
          "issueDate": "2026-11-23",
          "currency": "RON",
          "supplierId": "sup_019f0000000070008000000000000001",
          "acquisition": {
            "type": "Invoice",
            "number": "FURN1024",
            "issueDate": "2026-11-23",
            "dueDate": "2026-12-23",
            "totalWithVatInDocumentCurrency": 1210,
            "totalVatInDocumentCurrency": 210
          },
          "products": [
            {
              "name": "Produs exemplu",
              "code": "PROD-001",
              "measuringUnitName": "buc",
              "documentQuantity": 10,
              "receivedQuantity": 10,
              "purchasePriceWithoutVatInDocumentCurrency": 100,
              "isService": false,
              "destinationWarehouseId": "ware_019f0000000070008000000000000005",
              "purchaseVatRateId": "vat_019f0000000070008000000000000003",
              "sellingVatRateId": "vat_019f0000000070008000000000000003"
            }
          ]
        }
        ```

        </details>

        <details>
        <summary><strong>3. Emitere NIR in valuta</strong></summary>

        NIR pentru o factura de furnizor in EUR, pe o gestiune global-valorica. Pretul de achizitie se trimite in `currency`, pretul de vanzare in RON, iar `exchangeRate` face conversia. Exemplul completeaza si delegatul, mentiunile si observatiile.

        ```json
        {
          "status": "draft",
          "seriesName": "NIR",
          "issueDate": "2026-11-23",
          "currency": "EUR",
          "precision": 2,
          "exchangeRate": 5,
          "mentions": "Receptie conform facturii furnizorului",
          "observations": "Marfa verificata la descarcare",
          "committee": "Comisia de receptie",
          "supplierId": "sup_01a0d9032d8c782d91ddf1d151aec44c",
          "acquisition": {
            "type": "Invoice",
            "number": "FACT123",
            "issueDate": "2026-11-23",
            "dueDate": "2026-12-23",
            "totalWithVatInDocumentCurrency": 1210,
            "totalVatInDocumentCurrency": 210,
            "delegateName": "Ion Popescu",
            "delegateVehicleRegistration": "B-123-ABC"
          },
          "products": [
            {
              "name": "Example product",
              "code": "PROD-001",
              "measuringUnitName": "buc",
              "documentQuantity": 10,
              "receivedQuantity": 10,
              "purchasePriceWithoutVatInDocumentCurrency": 100,
              "sellingPriceWithoutVatInRON": 615,
              "isService": false,
              "destinationWarehouseId": "ware_01a0d9042da672d58723cba68ab04d8b",
              "purchaseVatRateId": "vat_01a0af2cdabd7c39a0750098e11b9960",
              "sellingVatRateId": "vat_01a0af2cdabd7c39a0750098e11b9960"
            }
          ]
        }
        ```

        </details>
