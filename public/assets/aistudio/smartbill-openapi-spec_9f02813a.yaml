    GoodsReceiptRequestV3:
      type: object
      required:
        - status
        - seriesName
        - issueDate
        - supplierId
        - products
      properties:
        status:
          type: string
          description: Starea NIR-ului emis. Deocamdata se accepta doar `draft`; orice alta valoare este respinsa.
          enum:
            - draft
          example: draft
        seriesName:
          type: string
          maxLength: 50
          description: Denumirea completa a unei serii de tip NIR din SmartBill. Literele mari si mici nu conteaza.
          example: NIR
        issueDate:
          type: string
          format: date
          description: Data NIR-ului, in format `YYYY-MM-DD`, intre `1970-01-01` si `9999-12-31`.
          example: '2026-11-23'
        currency:
          type: string
          maxLength: 20
          description: Moneda documentului de achizitie. Campurile `...InDocumentCurrency` sunt in aceasta moneda.
          example: EUR
        precision:
          type: integer
          description: Numarul de zecimale folosit pentru preturi. Se trimite ca numar intreg - `2`, nu `2.0`.
          default: 2
          enum:
            - 2
            - 3
            - 4
          example: 2
        exchangeRate:
          type: number
          description: Cati lei valoreaza o unitate din `currency` (`5` = 1 EUR = 5 RON). Obligatoriu pentru alte monede decat RON. Pentru RON se poate omite sau se trimite `1`.
          example: 5
        mentions:
          type: string
          maxLength: 500
          description: Mentiuni afisate pe document.
          example: Receptie conform facturii furnizorului
        observations:
          type: string
          maxLength: 500
          description: Observatii vizibile doar in contul SmartBill, nu apar pe document.
          example: Marfa verificata la descarcare
        committee:
          type: string
          maxLength: 200
          description: Comisia de receptie.
          example: Comisia de receptie
        supplierId:
          type: string
          description: ID-ul furnizorului, din [Furnizori](#api-1/tag/furnizori).
          example: sup_01a0d9032d8c782d91ddf1d151aec44c
        acquisition:
          description: Documentul de achizitie primit de la furnizor. Optional - pentru un NIR fara document de achizitie, campul se omite sau se trimite `null`.
          allOf:
            - $ref: '#/components/schemas/GoodsReceiptAcquisitionV3'
        products:
          type: array
          description: Liniile NIR-ului.
          items:
            $ref: '#/components/schemas/GoodsReceiptProductRequestV3'
    GoodsReceiptProductRequestV3:
      type: object
      required:
        - name
        - measuringUnitName
        - documentQuantity
        - receivedQuantity
        - purchasePriceWithoutVatInDocumentCurrency
        - destinationWarehouseId
      properties:
        name:
          type: string
          maxLength: 5000
          example: Example product
        code:
          type: string
          maxLength: 100
          description: Cod produs. Obligatoriu daca firma foloseste coduri de produs.
          example: PROD-001
        measuringUnitName:
          type: string
          maxLength: 200
          description: Unitatea de masura
          example: buc
        documentQuantity:
          type: number
          description: Cantitatea de pe documentul furnizorului
          example: 10
        receivedQuantity:
          type: number
          description: Cantitatea efectiv receptionata
          example: 10
        purchasePriceWithoutVatInDocumentCurrency:
          type: number
          description: Pretul unitar de achizitie fara TVA, in `currency`.
          example: 100.00
        sellingPriceWithoutVatInRON:
          type: number
          description: Pretul unitar de vanzare fara TVA, in RON. Obligatoriu pe gestiunile global-valorice (en detail), unde trebuie sa fie cel putin pretul de achizitie convertit in RON. Ignorat pe gestiunile cantitativ-valorice (en gros) si pe liniile de produse cu cantitate negativa (retur). La servicii este optional.
          example: 615
        isService:
          type: boolean
          description: Este serviciu
          example: false
        destinationWarehouseId:
          type: string
          description: ID-ul gestiunii in care intra marfa, din [Gestiuni](#api-1/tag/gestiuni).
          example: ware_01a0d9042da672d58723cba68ab04d8b
        purchaseVatRateId:
          type: string
          description: ID-ul cotei TVA de achizitie, din [Cote TVA](#api-1/tag/cote-tva). Obligatoriu daca furnizorul este platitor de TVA.
          example: vat_01a0af2cdabd7c39a0750098e11b9960
        sellingVatRateId:
          type: string
          description: ID-ul cotei TVA de vanzare, din [Cote TVA](#api-1/tag/cote-tva). Obligatoriu daca firma este platitoare de TVA. Pe gestiunile global-valorice nu se poate folosi o cota cu taxare inversa care are `reverseChargePercentage` mai mare decat 0.
          example: vat_01a0af2cdabd7c39a0750098e11b9960
