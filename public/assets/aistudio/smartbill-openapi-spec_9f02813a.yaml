              <td><code>missing_<span class="sb-brk"></span>required_<span class="sb-brk"></span>field</code><span class="sb-err-msg">The product received quantity is required.</span></td>
              <td>Sunt obligatorii atat <code>document<span class="sb-brk"></span>Quantity</code>, cat si <code>received<span class="sb-brk"></span>Quantity</code>.</td>
            </tr>
            <tr>
              <td>Cantitate zero</td>
              <td><code>invalid_<span class="sb-brk"></span>field_<span class="sb-brk"></span>value</code><span class="sb-err-msg">The received quantity cannot be zero.</span></td>
              <td>Cantitatile trebuie sa fie diferite de zero. Pentru retur se folosesc valori negative.</td>
            </tr>
            <tr>
              <td>Cantitate cu prea multe cifre</td>
              <td><code>invalid_<span class="sb-brk"></span>field_<span class="sb-brk"></span>value</code><span class="sb-err-msg">The received quantity must have at most 4 decimal digits.</span></td>
              <td>Maximum 15 cifre in partea intreaga si 4 zecimale.</td>
            </tr>
            <tr>
              <td>Unitate de masura fara factor de conversie</td>
              <td><code>product_<span class="sb-brk"></span>measuring_<span class="sb-brk"></span>unit_<span class="sb-brk"></span>conversion_<span class="sb-brk"></span>missing</code><span class="sb-err-msg">Measuring unit 'set' for product 'Widget' does not have a conversion factor. ...</span></td>
              <td>Se foloseste unitatea configurata pentru produs, scrisa exact (case-sensitive), sau se defineste conversia in Nomenclatoare &gt; Produse.</td>
            </tr>
            <tr>
              <td>Conversia face cantitatea zero</td>
              <td><code>product_<span class="sb-brk"></span>converted_<span class="sb-brk"></span>measuring_<span class="sb-brk"></span>unit_<span class="sb-brk"></span>quantity_<span class="sb-brk"></span>rounds_<span class="sb-brk"></span>to_<span class="sb-brk"></span>zero</code><span class="sb-err-msg">For product 'Widget', rounding the quantity expressed in measuring unit 'set' to 4 decimal places results in an invalid quantity of zero ...</span></td>
              <td>Factorii de conversie ai unitatii de masura trebuie verificati.</td>
            </tr>
            <tr>
              <td>Produsul nu poate fi identificat</td>
              <td><code>product_<span class="sb-brk"></span>with_<span class="sb-brk"></span>name_<span class="sb-brk"></span>not_<span class="sb-brk"></span>found</code><span class="sb-err-msg">Product 'Widget' was not found.</span></td>
              <td><code>name</code>, <code>code</code> si <code>is<span class="sb-brk"></span>Service</code> trebuie sa corespunda nomenclatorului.</td>
            </tr>
            <tr>
              <td>Produsul corespunde mai multor inregistrari</td>
              <td><code>duplicate_<span class="sb-brk"></span>stock_<span class="sb-brk"></span>product</code><span class="sb-err-msg">Product 'Widget' has multiple stock entries on the document.</span></td>
              <td>Nomenclatorul de produse contine dubluri care trebuie eliminate.</td>
            </tr>
          </tbody>
        </table>

        </details>

        <details>
        <summary><strong>Preturi si TVA</strong></summary>

        <table class="sb-op-table sb-op-table--3">
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Pret de achizitie lipsa</td>
              <td><code>missing_<span class="sb-brk"></span>required_<span class="sb-brk"></span>field</code><span class="sb-err-msg">The product purchase price is required.</span></td>
              <td><code>purchase<span class="sb-brk"></span>Price<span class="sb-brk"></span>Without<span class="sb-brk"></span>Vat<span class="sb-brk"></span>In<span class="sb-brk"></span>Document<span class="sb-brk"></span>Currency</code> este obligatoriu la fiecare pozitie.</td>
            </tr>
            <tr>
              <td>Pret de achizitie negativ</td>
              <td><code>invalid_<span class="sb-brk"></span>field_<span class="sb-brk"></span>value</code><span class="sb-err-msg">The product purchase price must be greater than or equal to zero.</span></td>
              <td>Pretul ramane pozitiv si la retur (linie cu cantitate negativa); semnul se da prin cantitate.</td>
            </tr>
            <tr>
              <td>Pret cu mai multe zecimale decat <code>precision</code></td>
              <td><code>invalid_<span class="sb-brk"></span>field_<span class="sb-brk"></span>value</code><span class="sb-err-msg">Price cannot have more than 2 decimal places for this document.</span></td>
              <td>Pretul se rotunjeste sau se mareste <code>precision</code>. <code>param</code> arata pozitia si campul.</td>
            </tr>
            <tr>
              <td>Pret de vanzare lipsa pe gestiune en detail</td>
              <td><code>missing_<span class="sb-brk"></span>required_<span class="sb-brk"></span>field</code><span class="sb-err-msg">The selling price must be provided for a retail destination warehouse.</span></td>
              <td><code>selling<span class="sb-brk"></span>Price<span class="sb-brk"></span>Without<span class="sb-brk"></span>Vat<span class="sb-brk"></span>In<span class="sb-brk"></span>RON</code> este obligatoriu pentru produsele receptionate in gestiuni en detail. Serviciile si liniile cu cantitate negativa (retur) il pot omite.</td>
            </tr>
            <tr>
              <td>Pret de vanzare negativ</td>
              <td><code>invalid_<span class="sb-brk"></span>field_<span class="sb-brk"></span>value</code><span class="sb-err-msg">The product selling price must be greater than or equal to zero.</span></td>
              <td>Pretul de vanzare trebuie sa fie pozitiv sau zero. Regula se aplica serviciilor (inclusiv la retur) si produselor cu cantitate pozitiva, pe orice tip de gestiune.</td>
            </tr>
            <tr>
              <td>Pret de vanzare sub pretul de achizitie (firma platitoare de TVA)</td>
              <td><code>invalid_<span class="sb-brk"></span>field_<span class="sb-brk"></span>value</code><span class="sb-err-msg">The selling price without VAT must be greater than or equal to the purchase price without VAT.</span></td>
              <td>Pe gestiune en detail, pretul de vanzare fara TVA al unui produs trebuie sa fie cel putin pretul de achizitie fara TVA convertit in RON. Nu se aplica serviciilor.</td>
            </tr>
            <tr>
              <td>Pret de vanzare sub pretul de achizitie (firma neplatitoare de TVA)</td>
              <td><code>invalid_<span class="sb-brk"></span>field_<span class="sb-brk"></span>value</code><span class="sb-err-msg">The selling price must be greater than or equal to the purchase price with VAT.</span></td>
              <td>Pe gestiune en detail, pretul de vanzare al unui produs trebuie sa fie cel putin pretul de achizitie cu TVA-ul furnizorului, convertit in RON. Nu se aplica serviciilor.</td>
            </tr>
            <tr>
              <td>Preturi de vanzare diferite pentru acelasi produs</td>
              <td><code>product_<span class="sb-brk"></span>selling_<span class="sb-brk"></span>price_<span class="sb-brk"></span>inconsistent</code><span class="sb-err-msg">Product 'Widget' cannot have multiple selling prices in warehouse 'Main' on the same document.</span></td>
              <td>Pozitiile aceluiasi produs din aceeasi gestiune en detail trebuie sa aiba acelasi pret de vanzare.</td>
            </tr>
            <tr>
              <td>Cote TVA de vanzare diferite pentru acelasi produs</td>
              <td><code>product_<span class="sb-brk"></span>vat_<span class="sb-brk"></span>rate_<span class="sb-brk"></span>inconsistent</code><span class="sb-err-msg">Product 'Widget' cannot have multiple VAT rates in warehouse 'Main' on the same document.</span></td>
              <td>Se foloseste aceeasi cota de vanzare pe pozitiile aceluiasi produs din aceeasi gestiune en detail.</td>
            </tr>
            <tr>
              <td>Cota de achizitie lipsa (furnizor platitor de TVA)</td>
              <td><code>missing_<span class="sb-brk"></span>required_<span class="sb-brk"></span>field</code><span class="sb-err-msg">The purchase VAT rate is required.</span></td>
              <td>Se trimite <code>purchase<span class="sb-brk"></span>Vat<span class="sb-brk"></span>Rate<span class="sb-brk"></span>Id</code>, din <a href="#api-1/tag/cote-tva">Cote TVA</a>.</td>
            </tr>
            <tr>
              <td>Cota de vanzare lipsa (firma platitoare de TVA)</td>
              <td><code>missing_<span class="sb-brk"></span>required_<span class="sb-brk"></span>field</code><span class="sb-err-msg">The selling VAT rate is required.</span></td>
              <td><code>selling<span class="sb-brk"></span>Vat<span class="sb-brk"></span>Rate<span class="sb-brk"></span>Id</code> este obligatoriu pe fiecare pozitie, inclusiv pe gestiuni en gros, servicii si linii cu cantitate negativa.</td>
            </tr>
            <tr>
              <td>Cota cu taxare inversa peste 0% la vanzare, pe gestiune global-valorica</td>
              <td><code>invalid_<span class="sb-brk"></span>field_<span class="sb-brk"></span>value</code><span class="sb-err-msg">The selling VAT rate cannot be a reverse-charge rate with the reverse charge percentage greater than 0.</span></td>
              <td>Pe gestiunile global-valorice, la vanzare se foloseste o cota fara taxare inversa sau cota cu taxare inversa care are <code>reverse<span class="sb-brk"></span>Charge<span class="sb-brk"></span>Percentage</code> 0. Cotele cu taxare inversa de 5%, 11%, 21% etc. se folosesc doar la achizitie.</td>
            </tr>
            <tr>
              <td>Cota TVA inexistenta in firma</td>
              <td><code>invalid_<span class="sb-brk"></span>field_<span class="sb-brk"></span>value</code><span class="sb-err-msg">The purchase VAT rate could not be found.</span></td>
              <td>Id-ul trebuie sa existe in <a href="#api-1/tag/cote-tva">Cote TVA</a>. Pentru cota de vanzare mesajul este <code>The selling VAT rate could not be found<span class="sb-brk"></span>.</code></td>
            </tr>
            <tr>
              <td>Id de cota cu prefix gresit</td>
              <td><code>invalid_<span class="sb-brk"></span>field_<span class="sb-brk"></span>value</code><span class="sb-err-msg">The 'products[0].purchaseVatRateId' field must start with 'vat_'.</span></td>
              <td>Id-ul se trimite integral, cu prefixul <code>vat_</code>.</td>
            </tr>
          </tbody>
        </table>

        </details>

        <details>
        <summary><strong>Gestiuni si stoc</strong></summary>

        <table class="sb-op-table sb-op-table--3">
          <thead>
            <tr>
              <th>Situatie</th>
              <th>Eroare</th>
              <th>Sugestie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>destination<span class="sb-brk"></span>Warehouse<span class="sb-brk"></span>Id</code> lipsa</td>
              <td><code>missing_<span class="sb-brk"></span>required_<span class="sb-brk"></span>field</code><span class="sb-err-msg">The product destination warehouse ID is required.</span></td>
              <td>Gestiunea este obligatorie pe fiecare pozitie, inclusiv la servicii.</td>
            </tr>
            <tr>
              <td>Id de gestiune cu prefix gresit</td>
              <td><code>invalid_<span class="sb-brk"></span>field_<span class="sb-brk"></span>value</code><span class="sb-err-msg">The 'products[0].destinationWarehouseId' field must start with 'ware_'.</span></td>
              <td>Id-ul se trimite integral, cu prefixul <code>ware_</code>.</td>
            </tr>
            <tr>
              <td>Gestiune inexistenta in firma</td>
              <td><code>invalid_<span class="sb-brk"></span>field_<span class="sb-brk"></span>value</code><span class="sb-err-msg">The warehouse with ID 'ware_01a0ee341fb17d8da8df382a41dcebaf' was not found.</span></td>
              <td>Id-ul trebuie sa existe in <a href="#api-1/tag/gestiuni">Gestiuni</a>.</td>
            </tr>
            <tr>
              <td>Data inaintea importului de stoc initial</td>
              <td><code>document_<span class="sb-brk"></span>date_<span class="sb-brk"></span>before_<span class="sb-brk"></span>initial_<span class="sb-brk"></span>stock</code><span class="sb-err-msg">The document date cannot precede the initial stock import. Initial stock was imported into warehouse 'Main' on 2026-09-01.</span></td>
              <td><code>issue<span class="sb-brk"></span>Date</code> trebuie sa fie ulterioara importului de stoc initial in gestiunile folosite.</td>
            </tr>
            <tr>
              <td>Linie cu cantitate negativa (retur) pe gestiune en gros cu CMP, fara cost mediu ponderat</td>
              <td><code>reversal_<span class="sb-brk"></span>weighted_<span class="sb-brk"></span>average_<span class="sb-brk"></span>cost_<span class="sb-brk"></span>not_<span class="sb-brk"></span>found</code><span class="sb-err-msg">Product 'Widget' has no weighted average cost in warehouse 'Main' on 2026-09-03, so it cannot be reversed.</span></td>
              <td>Produsul trebuie sa aiba o intrare pe un document finalizat si neanulat in acea gestiune, cel tarziu la data NIR-ului.</td>
            </tr>
            <tr>
              <td>Fara metoda de evaluare a stocului la data NIR-ului</td>
              <td><code>stock_<span class="sb-brk"></span>mode_<span class="sb-brk"></span>not_<span class="sb-brk"></span>found</code><span class="sb-err-msg">The company does not have a stock valuation method configured for the document date.</span></td>
              <td>Configurarea gestiunii firmei din SmartBill Cloud trebuie verificata.</td>
            </tr>
          </tbody>
        </table>

        </details>

