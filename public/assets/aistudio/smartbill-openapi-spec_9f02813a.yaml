                pagination:
                  next: https://ws.smartbill.ro/SBORO/api/v3/companies/{cif}/goods-receipts?dateFrom=2026-09-01&dateTo=2026-09-30&status=active&limit=1&after=gr_019f0000000070008000000000000004
                  previous: null
        '400':
          description: Parametri de paginare sau filtrare invalizi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseV3'
              examples:
                interval_inversat:
                  summary: dateFrom dupa dateTo
                  value:
                    status: 400
                    type: validation_error
                    instance: /SBORO/api/v3/companies/1234/goods-receipts
                    errors:
                      - code: invalid_field_value
                        message: dateFrom must be before or equal to dateTo
                        docUrl: https://api.smartbill.ro/#v3-error-validation_error
                        param: dateFrom
                limit_in_afara_intervalului:
                  summary: limit in afara intervalului 1-100
                  value:
                    status: 400
                    type: validation_error
                    instance: /SBORO/api/v3/companies/1234/goods-receipts
                    errors:
                      - code: invalid_field_value
                        message: The 'limit' field must be between 1 and 100.
                        docUrl: https://api.smartbill.ro/#v3-error-validation_error
                        param: limit
                before_si_after_impreuna:
                  summary: before si after folosite simultan
                  value:
                    status: 400
                    type: validation_error
                    instance: /SBORO/api/v3/companies/1234/goods-receipts
                    errors:
                      - code: invalid_field_value
                        message: You can only use 'before' or 'after', not both at the same time.
                        docUrl: https://api.smartbill.ro/#v3-error-validation_error
