                      isVatPayer: true
                    acquisition:
                      type: Invoice
                      number: FURN1024
                      issueDate: '2026-11-23'
                      dueDate: '2026-12-23'
                      totalWithVatInDocumentCurrency: 1210
                      totalVatInDocumentCurrency: 210
                      delegateName: ""
                      delegateVehicleRegistration: ""
                    products:
                      - name: Produs exemplu
                        code: PROD-001
                        measuringUnitName: buc
                        documentQuantity: 10
                        receivedQuantity: 10
                        purchasePriceWithoutVatInRON: 100
                        purchasePriceWithVatInRON: 121
                        purchasePriceWithoutVatInDocumentCurrency: 100
                        purchasePriceWithVatInDocumentCurrency: 121
                        sellingPriceWithoutVatInRON: 150
                        sellingPriceWithVatInRON: 181.5
                        isService: false
                        destinationWarehouseId: ware_019f0000000070008000000000000002
                        purchaseVatRateId: vat_019f0000000070008000000000000003
